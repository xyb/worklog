# worklog (wl) configuration — optional, created by `wl config init`. Edit as needed.
# `wl config` shows the resolved values; `wl help config` explains them.
# Everything below is COMMENTED OUT, so the built-in defaults apply until you uncomment + edit.

# ── Embedding backend for `wl query` / `wl reindex` ──
# Resolution order (later wins): built-in defaults < this file < $WORKLOG_EMBED_* env < CLI flags.
# Values shown are the DEFAULTS.
[embedding]
# OpenAI-compatible /v1/embeddings endpoint. Default = a local Ollama.
# (e.g. another host: http://192.168.1.10:11434/v1/embeddings, or a commercial API)
# endpoint = http://localhost:11434/v1/embeddings

# Embedding model name — must exist on that server (e.g. `ollama pull qwen3-embedding:0.6b`).
# model = qwen3-embedding:0.6b

# Truncate embeddings to N dimensions, if the model supports it. Blank = model's native size.
# dimensions =

# Bearer token, for a commercial / authenticated endpoint. Blank = none (most local servers).
# api_key =

# Query template applied to the QUERY only (not documents): {query} = the query text, \n = newline.
# Default is Qwen3-Embedding's official retrieval prompt (shown below). Set it EMPTY to disable —
# do that for a server that already adds the instruction itself (e.g. nmem), to avoid doing it twice.
# query_prompt = Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:{query}

# ── Semantic index upkeep ──
# After any write, wl spawns a detached single-flight background `wl reindex --auto`
# so search stays fresh without a manual reindex. On by default; uncomment to turn off
# (or set $WORKLOG_AUTO_REINDEX=0).
[index]
# auto_reindex = false

# ── Synonym groups for `wl query`'s keyword side ──
# `canonical = alias1, alias2` — searching any member also matches the others
# (great for names / pinyin / aliases / abbreviations). canonical is the left-hand side.
[synonyms]
# example — replace with your own, or delete:
# New York = NYC, NY
