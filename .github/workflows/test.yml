name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync deps
        run: uv sync --all-groups

      - name: Run tests with coverage
        run: uv run pytest --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Smoke test CLI
        run: |
          set -euo pipefail
          export WORKLOG_DB=$(mktemp -d)/worklog.db
          uv run wl init
          uv run wl --version
          uv run wl add "ci smoke task" -p A --sched today
          uv run wl log 1 "hello from CI"
          uv run wl recap "ci smoke recap"   # creates today's day skeleton so the overview renders
          uv run wl show 1
          uv run wl day
          # wl tree must render real structure (the timeline + the scheduled task),
          # not just exit 0 on an empty overview — assert the task title shows up.
          tree=$(uv run wl tree)
          printf '%s\n' "$tree"
          printf '%s\n' "$tree" | grep -q "ci smoke task" || { echo "::error::wl tree rendered no structure"; exit 1; }
          uv run wl done 1
          uv run wl migrate
