[pytest]
# pytest-xdist 并行: -n auto 用全部核; --dist=loadgroup 让同类聚到一进程减开销
# 覆盖率门槛 95% line+branch combined; 低于即 fail (硬规则, 不可降)
# --cov=wl 测目标; --cov-branch 启用分支覆盖
addopts = -q -n auto --cov=wl --cov-branch --cov-report=term-missing --cov-fail-under=95
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[coverage:run]
branch = True
source = wl

[coverage:report]
# 排除 TTY/启动配色等难测函数行 (经评估非核心路径, 单独维护此列表)
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
