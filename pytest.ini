[pytest]
# pytest-xdist parallel: -n auto uses all cores; --dist=loadgroup groups similar tests into one worker to reduce overhead
# Coverage gate 95% line+branch combined; below that fails (hard rule, not negotiable)
# --cov=wl is the target; --cov-branch enables branch coverage
addopts = -q -n auto --cov=wl --cov-branch --cov-report=term-missing --cov-fail-under=95
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[coverage:run]
branch = True
source = wl

[coverage:report]
# Exclude lines that aren't worth testing (TTY / startup color detection); reviewed individually, kept here for transparency.
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
