[project]
name = "pyworklog"
version = "0.9.0"
description = "SQLite-backed worklog tool with a todo.sh-style CLI"
readme = "README.md"
license = "MIT"
authors = [{ name = "Xie Yanbo" }]
requires-python = ">=3.9"
keywords = ["worklog", "cli", "sqlite", "todo", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13",
]

[project.optional-dependencies]
# Semantic search (`wl query` / `wl reindex`): embeds via any OpenAI-compatible
# HTTP server (stdlib urllib, no dep). This extra is the FAST path — LanceDB for
# the vector store + jieba for CJK segmentation. Both are optional: without them
# `wl query`/`reindex` auto-fall-back to a pure-Python SQLite store + `\w+`
# segmentation (works on every Python/platform, just slower). LanceDB ships
# forward-compatible (abi3) wheels for Python 3.9–3.14 on Linux + Apple-Silicon
# macOS; jieba is pure-Python (installs anywhere).
semantic = [
    "lancedb>=0.13",
    "jieba>=0.42",
]

[project.urls]
Homepage = "https://github.com/xyb/worklog"
Repository = "https://github.com/xyb/worklog"
Issues = "https://github.com/xyb/worklog/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "coverage>=7.5",
    "lancedb>=0.13",   # exercise the FAST semantic-search path in CI (the SQLite/\w+ fallback
    "jieba>=0.42",     # is tested too, by monkeypatching these away — see tests/test_vectorstore.py)
]

[project.scripts]
wl = "worklog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worklog"]
