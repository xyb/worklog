[project]
name = "pyworklog"
version = "0.4.0"
description = "SQLite-backed worklog tool with a todo.sh-style CLI"
readme = "README.md"
license = "MIT"
authors = [{ name = "Xie Yanbo" }]
requires-python = ">=3.11"
keywords = ["worklog", "cli", "sqlite", "todo", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/xyb/worklog"
Repository = "https://github.com/xyb/worklog"
Issues = "https://github.com/xyb/worklog/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "coverage>=7.5",
]

[project.scripts]
wl = "worklog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worklog"]
